<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1200&q=80');

    background-position:center;
    display:flex;
    justify-content:center;

.box{
    width:100%;

    border-radius:20px;

    box-shadow:0 0 25px rgba(255,193,7,.5);
}

.box img{
    width:170px;
    height:170px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #00ff66;
    box-shadow:0 0 20px #00ff66;
}

h1{
    color:#ffc107;
    font-size:34px;
    margin:20px 0 10px;
}

h3{
    color:#ddd;
    margin-bottom:20px;
    font-weight:normal;
}

ul{
    text-align:left;
    font-size:20px;
    line-height:1.8;
    margin-bottom:20px;
}

.btn{
    display:block;
    width:100%;
    background:#ffc107;
    color:#000;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.03);
    background:#ffd54f;
}

.timer{

    font-size:18px;

<script>
let sec = 20;

},1000);
</script>
